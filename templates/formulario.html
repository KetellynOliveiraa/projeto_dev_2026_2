<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar aluguel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Solicitar aluguel de equipamento/trilha</h1>

        {% if erros %}
            <div class="erros">
                <ul>
                    {% for erro in erros %}
                        <li>{{ erro }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}

        <form method="POST">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" value="{{ nome or '' }}" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ email or '' }}" required>

            <label for="opcao_id">O que deseja alugar:</label>
            <select id="opcao_id" name="opcao_id" required>
                {% for opcao in opcoes %}
                    <option value="{{ opcao.id }}">{{ opcao.titulo }}</option>
                {% endfor %}
            </select>

            <label for="data">Data desejada:</label>
            <input type="date" id="data" name="data" value="{{ data or '' }}" required>

            <button type="submit">Enviar solicitação</button>
        </form>
    </div>
</body>
</html>
