<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel administrativo</title>
</head>
<body>
    <h1>Painel administrativo</h1>
    <a href="{{ url_for('logout') }}">Sair</a>

    <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Equipamento/Trilha</th>
                <th>Data</th>
                <th>Status</th>
                <th>Criado em</th>
            </tr>
        </thead>
        <tbody>
            {% for registro in registros %}
                <tr>
                    <td>{{ registro.nome }}</td>
                    <td>{{ registro.email }}</td>
                    <td>{{ registro.opcao.titulo }}</td>
                    <td>{{ registro.data }}</td>
                    <td>{{ registro.status }}</td>
                    <td>{{ registro.criado_em.strftime('%d/%m/%Y %H:%M') }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
